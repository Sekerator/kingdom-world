plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // Hooks into vanilla code where Forge offers no event (fire spreading); Mixin itself ships with Forge.
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 ships Java 17 to players, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required so that resources are available when the game is launched from an IDE.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // "gradlew runClient -PquickPlayWorld=<save folder>" opens that singleplayer world right away.
            if (project.hasProperty('quickPlayWorld')) {
                args '--quickPlaySingleplayer', project.property('quickPlayWorld')
            }
            // "gradlew runClient -PclientSelfTest=title|layout|world" runs the client self-test (see ClientSelfTest).
            if (project.hasProperty('clientSelfTest')) {
                property 'kingdomworld.clientSelfTest', project.property('clientSelfTest')
            }
            if (project.hasProperty('clientSelfTestScreenshots')) {
                property 'kingdomworld.clientSelfTest.screenshots', project.property('clientSelfTestScreenshots')
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Starts a game test server, runs every registered game test and exits.
        // A non-zero exit code means at least one required test failed.
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            // No mob spawning and no weather in the world of the game tests, as in the test server of the game.
            property 'kingdomworld.gameTestWorld', 'true'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Every run of the game tests starts in a new world: what a failed test leaves on its place (lava, stone, a kingdom) must not
// wait for whatever test of a later run comes to stand there. "-PkeepGameTestWorld" runs them in the world of the last run.
// The world is an ordinary one, the tests standing deep under its land: the new world has the same land every time (the seed
// below, or "-PgameTestSeed=..."), because the tests of roads, camps and kingdoms of the world read its surface.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        if (!project.hasProperty('keepGameTestWorld')) {
            delete file('run-gametest/world')
            def seed = project.findProperty('gameTestSeed') ?: '1'
            def properties = file('run-gametest/server.properties')
            def lines = properties.exists() ? properties.readLines('UTF-8').findAll { !it.startsWith('level-seed=') } : []
            lines.add("level-seed=${seed}".toString())
            properties.parentFile.mkdirs()
            properties.write(lines.join('\n') + '\n', 'UTF-8')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Resources produced by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// The generator of the built-in building templates lives apart from the mod and never goes into the jar.
sourceSets {
    generator {
        java.srcDir 'src/generator/java'
    }
}

// "gradlew generateBuildings" draws the built-in building templates again, and the data pack of the smoke check.
tasks.register('generateBuildings', JavaExec) {
    group = 'kingdomworld'
    description = 'Writes the built-in building templates and the data pack of the smoke check'
    classpath = sourceSets.generator.runtimeClasspath
    mainClass = 'io.github.sekerator.kingdomworld.generator.BuildingGenerator'
    args file('src/main/resources/data/kingdomworld/kingdomworld_buildings').absolutePath, file('scripts/smoke-datapack').absolutePath
}

repositories {
    // ForgeGradle adds the Forge maven and Maven Central automatically.
    // Map mods for the soft integrations in the compat package: their APIs at compile time only, the mods themselves
    // only in the development runs started with -PwithMaps. Nothing of them goes into the jar.
    maven {
        name = 'BlueMap'
        url = 'https://repo.bluecolored.de/releases'
        content { includeGroup 'de.bluecolored.bluemap' }
    }
    maven {
        name = 'Dynmap'
        url = 'https://repo.mikeprimm.com/'
        content { includeGroup 'us.dynmap' }
    }
    // Not exclusive: ForgeGradle serves the remapped copies of these mods under the same group from its own repository.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    flatDir {
        name = 'NestedMapLibraries'
        dirs layout.buildDirectory.dir('map-libs')
    }
}

// Versions of the map mods the integrations are built and checked against (Modrinth version ids for Forge 1.20.1):
// JourneyMap 1.20.1-6.0.7 (its API 2.0.0 comes inside the mod), Xaero's World Map 1.47.0, Xaero's Minimap 26.6.0,
// Common Network 1.0.6 (needed by JourneyMap).
def mapMods = [
        journeymap      : 'maven.modrinth:journeymap:HWDC99DO',
        xaeroWorldMap   : 'maven.modrinth:xaeros-world-map:KtEupJvB',
        xaeroMinimap    : 'maven.modrinth:xaeros-minimap:dB6E0CY9',
        commonNetworking: 'maven.modrinth:common-network:TkOARDQh',
]
// -PwithMaps=journeymap,xaero (or "all") adds the client map mods to the development runs.
def withMaps = project.hasProperty('withMaps') ? project.property('withMaps').toString().split(',')*.trim() : []

// Magic mods for the soft integrations of the mage tower (the versions of the user's pack): Iron's Spells 'n Spellbooks
// 1.20.1-3.4.0.11 and Ars Nouveau 4.12.7, with what they need to run: GeckoLib 4.8.4, Curios 5.14.1, Caelus 3.2.0 and
// playerAnimator 1.0.2-rc1. Compile only; -PwithMagic adds them to the development runs.
def magicMods = [
        irons         : 'maven.modrinth:irons-spells-n-spellbooks:K26TSnWZ',
        arsNouveau    : 'maven.modrinth:ars-nouveau:Hw2aD01e',
        geckolib      : 'maven.modrinth:geckolib:aC5KMoNg',
        curios        : 'maven.modrinth:curios:IPQlZkz1',
        caelus        : 'maven.modrinth:caelus:mRry0DgY',
        playerAnimator: 'maven.modrinth:playeranimator:xe2EVE6q',
]
def withMagic = project.hasProperty('withMagic')

configurations {
    mapModJars { transitive = false }
}

// The JourneyMap API and the library of Xaero's maps are only published inside the mods (as nested jars), so they
// are taken out of the downloaded mods.
def mapLibs = layout.buildDirectory.dir('map-libs')
tasks.register('extractMapLibraries', Copy) {
    from({ configurations.mapModJars.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/journeymap-api-*.jar', 'META-INF/jarjar/xaerolib-*.jar'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into mapLibs
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Soft compatibility modules must never add compile or runtime dependencies on other mods here.
    // They are activated at runtime only when ModList reports the mod as loaded.
    // Map mods: compile only (see the repositories above); the jar has no dependency on them.
    compileOnly 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    compileOnly 'us.dynmap:DynmapCoreAPI:3.7-beta-6'
    compileOnly fg.deobf(mapMods.xaeroWorldMap)
    compileOnly fg.deobf(mapMods.xaeroMinimap)
    mapModJars mapMods.journeymap
    mapModJars mapMods.xaeroWorldMap
    compileOnly files(mapLibs.map { it.file('journeymap-api-forge-1.20.1-2.0.0.jar') }) {
        builtBy 'extractMapLibraries'
    }
    if ('journeymap' in withMaps || 'all' in withMaps) {
        runtimeOnly fg.deobf(mapMods.journeymap)
        runtimeOnly fg.deobf(mapMods.commonNetworking)
    }
    if ('xaero' in withMaps || 'all' in withMaps) {
        runtimeOnly fg.deobf(mapMods.xaeroWorldMap)
        runtimeOnly fg.deobf(mapMods.xaeroMinimap)
        runtimeOnly fg.deobf('local:xaerolib-forge-1.20.1:1.7.3')
    }

    // The tests check that the committed building templates are exactly what the generator draws.
    testImplementation sourceSets.generator.output

    // Magic mods: compile only, for the wells of the mage tower (compat.irons, compat.arsnouveau).
    compileOnly fg.deobf(magicMods.irons) { transitive = false }
    compileOnly fg.deobf(magicMods.arsNouveau) { transitive = false }
    if (withMagic) {
        runtimeOnly fg.deobf(magicMods.irons) { transitive = false }
        runtimeOnly fg.deobf(magicMods.arsNouveau) { transitive = false }
        runtimeOnly fg.deobf(magicMods.geckolib) { transitive = false }
        runtimeOnly fg.deobf(magicMods.curios) { transitive = false }
        runtimeOnly fg.deobf(magicMods.caelus) { transitive = false }
        runtimeOnly fg.deobf(magicMods.playerAnimator) { transitive = false }
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Used by the core purity test to locate the sources it scans.
    systemProperty 'kingdomworld.mainSourceDir', file('src/main/java').absolutePath
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // A dedicated server reads translations from data packs (data/<namespace>/lang), not from assets.
    // Shipping the English strings there as well makes command feedback readable in the server console.
    from("src/main/resources/assets/${mod_id}/lang") {
        include 'en_us.json'
        into "data/${mod_id}/lang"
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // Game tests run from the classes of the development build; the jar of the players does without them and their template.
    exclude 'io/github/sekerator/kingdomworld/common/gametest/**'
    exclude 'data/kingdomworld/structures/empty.nbt'

    // Produces the SRG-named jar that runs outside the development environment.
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
